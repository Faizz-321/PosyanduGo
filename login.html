<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PosyanduGo</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image:
                radial-gradient(at 0% 0%, rgba(252, 231, 243, 0.7) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(255, 228, 230, 0.7) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(244, 114, 182, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            font-family: var(--font-body);
        }
        
        .login-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 48px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .login-container:hover {
            transform: translateY(-5px);
        }

        .login-logo {
            width: 72px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 6px rgba(236, 72, 153, 0.2));
        }

        .login-title {
            font-family: var(--font-heading);
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-color), #be185d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            margin-top: 0;
        }

        .login-subtitle {
            color: var(--text-muted);
            margin-bottom: 32px;
            font-size: 15px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 24px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-main);
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 15px;
            transition: all 0.3s ease;
            box-sizing: border-box;
            background-color: #f8fafc;
            color: var(--text-main);
            font-family: var(--font-body);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: white;
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
            border: none;
            border-radius: var(--radius-full);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: var(--font-body);
            box-shadow: 0 4px 14px rgba(236, 72, 153, 0.3);
            margin-top: 8px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, var(--primary-hover), #be185d);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4);
            transform: translateY(-2px);
        }
        
        .btn-login:active {
            transform: scale(0.98);
        }

        .error-message {
            color: var(--danger-color);
            background-color: var(--danger-light);
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        
        .footer-text {
            margin-top: 32px;
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <img src="logo.png" alt="PosyanduGo Logo" class="login-logo" onerror="this.style.display='none'">
            <h1 class="login-title">PosyanduGo</h1>
            <p class="login-subtitle">Sistem Informasi Terpadu Posyandu</p>
            
            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username Kader</label>
                    <input type="text" id="username" class="form-control" placeholder="Masukkan username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
                </div>
                <button type="submit" class="btn-login" id="btnLogin">Masuk ke Sistem</button>
            </form>
            
            <div class="footer-text">
                &copy; 2026 PosyanduGo. All rights reserved.
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
